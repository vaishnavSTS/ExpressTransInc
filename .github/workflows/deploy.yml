# Builds the site and publishes dist/ to GitHub Pages on every push to main.
# Settings come from repository variables (Settings -> Secrets and variables -> Actions -> Variables).
# The URL prefix and site URL follow the Pages settings automatically (github.io or custom domain).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Reports the Pages URL: base_path is "/ExpressTransInc" on github.io, "" on a custom domain.
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || steps.pages.outputs.base_url }}
          VITE_ALLOW_INDEXING: ${{ vars.VITE_ALLOW_INDEXING }}
          VITE_QUOTE_ENDPOINT: ${{ vars.VITE_QUOTE_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
